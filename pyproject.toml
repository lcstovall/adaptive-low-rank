[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive_low_rank"
version = "0.1.0"
description = "Adaptive algorithms for low-rank matrix approximation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Luke Stovall"},
    {name = "Kevin Miller"},
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=1.5",
    "PyYAML>=6.0",
    "scikit-learn>=1.2",
    "pillow>=9.0",
    "graphlearning>=1.7.5",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[project.urls]
Repository = "https://github.com/lcstovall/adaptive-low-rank"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py310"]
skip-magic-trailing-comma = true