[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive_low_rank"
version = "0.1.0"
description = "Algorithms for low-rank matrix approximation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Luke Stovall"},
    {name = "Kevin Miller"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
    "pandas>=1.5",
    "PyYAML>=6.0",
    "scikit-learn",
    "pillow",
]

[project.urls]
Repository = "https://github.com/lcstovall/adaptive-low-rank"

[tool.setuptools.packages.find]
where = ["src"]